<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain 設計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<button class="nav-btn" id="navBtn" aria-controls="sideNav"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="8" y1="3.5" x2="8" y2="16.5" stroke="currentColor" stroke-width="1.8"/></svg></button>

<div class="shell">
  <nav class="side-nav" id="sideNav" aria-label="導覽">
    <div class="nav-top"><a class="brand" href="#/">DOMAIN 設計</a></div>
    <div id="navTree"></div>
  </nav>
  <div class="page">
    <header class="top">
      <a class="brand" href="#/">DOMAIN 設計</a>
      <a class="back" id="back" hidden></a>
      <div class="top-mid" id="topMid"></div>
      <button class="ai-btn" id="aiBtn"><span class="dot" id="aiDot"></span><span id="aiLabel">AI</span></button>
    </header>
    <main id="app"></main>
  </div>
</div>

<aside class="drawer file" id="fileDrawer" hidden aria-label="檔案">
  <div class="drawer-head"><strong id="filePath"></strong><button class="x" data-close="fileDrawer" aria-label="關閉">✕</button></div>
  <pre class="file-body" id="fileBody"></pre>
</aside>

<aside class="drawer ai" id="aiDrawer" hidden aria-label="AI 對話">
  <div class="drawer-head"><strong>AI 對話</strong><button class="x" data-close="aiDrawer" aria-label="關閉">✕</button></div>
  <div class="ai-session" id="aiSession"></div>
  <div class="ai-log" id="aiLog"></div>
  <form class="ai-form" id="aiForm">
    <textarea id="aiInput" rows="2" placeholder="畫面上的按鈕涵蓋不到的事，才在這裡打字（Enter 換行）"></textarea>
    <button type="submit" class="btn primary" id="aiSend">送出</button>
  </form>
</aside>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>

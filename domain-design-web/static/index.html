<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Lumori Domain 設計</title>
<script>/* 深淺色：照上次的選擇，在畫面出現前就套上，不會閃一下（theme.js） */try{var t=localStorage.getItem('lumori-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/lumori-tokens.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <nav class="side-nav" id="sideNav" aria-label="導覽">
    <div class="nav-top">
      <button class="nav-toggle" id="navClose" title="收起側欄（Ctrl+\）" aria-label="收起側欄" aria-controls="sideNav"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><line x1="8" y1="3.5" x2="8" y2="16.5" stroke="currentColor" stroke-width="1.7"/></svg></button>
    </div>
    <div id="navTree"></div>
  </nav>
  <div class="page">
    <header class="top">
      <button class="nav-toggle" id="navBtn" aria-controls="sideNav"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <div class="logo">
        <a class="lm-wordmark" href="#/" aria-label="Lumori 首頁"><b><span>LUM</span><span class="o" aria-hidden="true"></span><span>RI</span></b></a>
        <a class="brand" href="#/">DOMAIN 設計</a>
      </div>
      <a class="back" id="back" hidden></a>
      <div class="top-mid" id="topMid"></div>
      <button class="theme-btn" id="themeBtn" type="button"><svg class="i-sys" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg><svg class="i-light" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.2v2M10 15.8v2M2.2 10h2M15.8 10h2M4.5 4.5l1.4 1.4M14.1 14.1l1.4 1.4M4.5 15.5l1.4-1.4M14.1 5.9l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><svg class="i-dark" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M16.2 12.4A6.8 6.8 0 0 1 7.6 3.8a6.8 6.8 0 1 0 8.6 8.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
      <button class="ai-btn" id="aiBtn"><span class="dot" id="aiDot"></span><span id="aiLabel">AI</span></button>
    </header>
    <main id="app"></main>
  </div>
</div>

<aside class="drawer file" id="fileDrawer" hidden aria-label="檔案">
  <div class="drawer-head"><nav class="dtabs" role="tablist"><button data-tab="aiDrawer">AI 對話</button><button data-tab="fileDrawer" class="ftab" disabled>檔案</button></nav><button class="x" data-close="fileDrawer" aria-label="關閉">✕</button></div>
  <div class="file-path" id="filePath"></div>
  <pre class="file-body" id="fileBody"></pre>
</aside>

<aside class="drawer ai" id="aiDrawer" hidden aria-label="AI 對話">
  <div class="drawer-head"><nav class="dtabs" role="tablist"><button data-tab="aiDrawer">AI 對話</button><button data-tab="fileDrawer" class="ftab" disabled>檔案</button></nav><button class="x" data-close="aiDrawer" aria-label="關閉">✕</button></div>
  <div class="ai-session" id="aiSession"></div>
  <div class="ai-log" id="aiLog"></div>
  <div class="ai-next" id="aiNext"></div>
  <form class="ai-form" id="aiForm">
    <textarea id="aiInput" rows="2" placeholder="畫面上的按鈕涵蓋不到的事，才在這裡打字（Enter 送出，Shift+Enter 換行）"></textarea>
    <button type="submit" class="btn primary" id="aiSend">送出</button>
  </form>
</aside>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
